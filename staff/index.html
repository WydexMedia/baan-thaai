<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baan Thai Staff</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#150d17">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:wght@400;500;600&family=Saira:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<script src="../config.js"></script>
</head>
<body>
<div class="shell staff" id="shell">
  <div class="main">
    <header class="mast">
      <div class="mast-in">
        <div class="mast-row">
          <img class="logo" src="../assets/logo.png" alt="Baan Thai Kitchen &amp; Cafe" width="168" height="58">
          <div class="who-chip" id="who" hidden></div>
        </div>
        <div class="where"><span>Staff area</span><span><b>●</b> Calicut International Airport</span></div>
        <nav class="tabs" id="tabs" hidden>
          <a href="#counter" data-r="counter">Counter</a>
          <a href="#bookings" data-r="bookings">Bookings</a>
          <a href="#settings" data-r="settings">Settings</a>
        </nav>
      </div>
    </header>
    <main class="wrap" id="view"><p class="small"><span class="spin"></span> Loading…</p></main>
  </div>
</div>
<div id="dwrap" hidden><div class="scrim"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title"></aside></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<canvas id="work" hidden></canvas>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/vendor/jspdf.umd.min.js"></script>
<script src="../assets/vendor/jsQR.js"></script>
<script src="../assets/common.js"></script>
<script src="../assets/staff.js"></script>
</body>
</html>
